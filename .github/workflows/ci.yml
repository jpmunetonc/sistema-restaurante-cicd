name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Variables dummy para compilar y servir la app sin un proyecto Supabase real.
      NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      # Disponible en el contexto `env` de los pasos para evaluar el `if` de SonarCloud.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Historial completo: SonarCloud lo necesita para blame/new code.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos (tsc)
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Lint (ESLint)
        run: npm run lint

      - name: Auditoría de dependencias
        run: npm audit --audit-level=high

      - name: Pruebas unitarias y de integración con cobertura
        run: npm run test:coverage

      - name: Build de producción
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (Playwright)
        run: npm run test:e2e

      - name: SonarCloud Scan
        # Se omite si el repositorio no tiene definido el secreto SONAR_TOKEN.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}